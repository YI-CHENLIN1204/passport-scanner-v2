      - name: Verify traveler merge reconciles duplicate current document types
        run: |
          REVIEWED_AT_OLD='2026-01-01T00:00:00Z'
          REVIEWED_AT_NEW='2026-02-01T00:00:00Z'

          curl --fail --silent -X POST http://localhost:5080/api/passport-reviews \
            -H 'Content-Type: application/json' \
            -d "{\"schemaVersion\":2,\"documentType\":\"passport\",\"chineseName\":\"合併舊證\",\"englishName\":\"MERGE OLD\",\"passportNumber\":\"M33333333\",\"nationality\":\"TWN\",\"issuingState\":\"TWN\",\"birthDate\":\"1992-02-02\",\"sex\":\"M\",\"expiryDate\":\"2034-01-01\",\"verification\":{\"passportNumberCheckDigit\":true,\"birthDateCheckDigit\":true,\"expiryDateCheckDigit\":true,\"compositeCheckDigit\":true},\"reviewAssertions\":{\"chineseNameVisuallyConfirmed\":true,\"englishNameVisuallyConfirmed\":true},\"ocr\":{\"engine\":\"paddleocr-ppocrv5\",\"line2Validated\":true,\"chineseNameSource\":\"name-field\",\"chineseNameScore\":0.9,\"chineseNameRomanizationStatus\":\"compatible\",\"fallbackUsed\":false,\"averageScore\":0.9},\"reviewedAt\":\"$REVIEWED_AT_OLD\"}" \
