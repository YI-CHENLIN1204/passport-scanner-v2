name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/PassportScanner.Api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-smoke:
    name: PostgreSQL and workflow smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start application stack
        run: docker compose up -d --build database backend frontend

      - name: Wait for API and frontend proxy
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:5080/api/health > /dev/null

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5173/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs frontend backend database
          exit 1

      - name: Verify persistence and schema
        run: |
          curl --fail --silent http://localhost:5080/api/document-store/status > /tmp/store-status.json
          grep -q '"persistence":"postgresql"' /tmp/store-status.json

          docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('travelers','document_versions','tours','tour_members','tour_member_documents','scan_batches','scan_items','tour_person_drafts','training_samples','ocr_evaluation_baselines','ocr_benchmark_runs') ORDER BY table_name;" > /tmp/tables.txt
          cat /tmp/tables.txt
          grep -q '^document_versions$' /tmp/tables.txt
          grep -q '^ocr_benchmark_runs$' /tmp/tables.txt
          grep -q '^ocr_evaluation_baselines$' /tmp/tables.txt
          grep -q '^scan_batches$' /tmp/tables.txt
          grep -q '^scan_items$' /tmp/tables.txt
          grep -q '^tour_members          grep -q '^tour_person_drafts$' /tmp/tables.txt
          grep -q '^tours$' /tmp/tables.txt
          grep -q '^training_samples$' /tmp/tables.txt
          grep -q '^travelers$' /tmp/tables.txt

      - name: Verify tour create and filters
        run: |
          curl --fail --silent -X POST http://localhost:5080/api/tours \
            -H 'Content-Type: application/json' \
            -d '{"tourName":"CI 測試團","departureDate":"2099-10-10","returnDate":"2099-10-12","requiredDocumentTypes":["PASSPORT","TAIWAN_COMPATRIOT_PERMIT"]}' \
            > /tmp/tour.json

          grep -q '"tourName":"CI 測試團"' /tmp/tour.json
          grep -q '"requiredDocumentTypes":\["PASSPORT","TAIWAN_COMPATRIOT_PERMIT"\]' /tmp/tour.json

          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID" > /tmp/tour-detail.json
          grep -q '"members":\[\]' /tmp/tour-detail.json

          curl --fail --silent "http://localhost:5080/api/tours?status=empty&documentType=PASSPORT&departureFrom=2099-10-01&departureTo=2099-10-31" > /tmp/tours-filtered.json
          grep -q "$TOUR_ID" /tmp/tours-filtered.json

          curl --fail --silent "http://localhost:5080/api/tours?status=complete" > /tmp/tours-complete.json
          if grep -q "$TOUR_ID" /tmp/tours-complete.json; then
            echo "Empty tour must not appear in complete filter."
            exit 1
          fi

      - name: Verify staged review, batch lifecycle and training
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")
          IMAGE_BASE64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/passport-batch.json
          PASSPORT_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/passport-batch.json'))['scanBatchId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"TAIWAN_COMPATRIOT_PERMIT"}' \
            > /tmp/permit-batch.json
          PERMIT_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-batch.json'))['scanBatchId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PASSPORT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"passport.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小明\",\"nameEn\":\"WANG, HSIAO-MING\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":\"TWN\",\"documentNumber\":\"T12345678\",\"issuingCountry\":\"TWN\",\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{}\"}" \
            > /tmp/passport-scan-item.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PERMIT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"permit.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小朋\",\"nameEn\":\"\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":null,\"documentNumber\":\"12345678\",\"issuingCountry\":null,\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{\\\"totalMs\\\":1234,\\\"orientationAttempts\\\":2,\\\"fallbackUsed\\\":false,\\\"originalFields\\\":{\\\"nameZh\\\":\\\"王小朋\\\",\\\"nameZhTraditional\\\":\\\"王小朋\\\",\\\"nameEn\\\":\\\"\\\",\\\"birthDate\\\":\\\"1990-01-15\\\",\\\"gender\\\":\\\"M\\\",\\\"nationality\\\":null,\\\"documentNumber\\\":\\\"12345678\\\",\\\"issuingCountry\\\":null,\\\"expiryDate\\\":\\\"2030-12-31\\\"}}\"}" \
            > /tmp/permit-scan-item.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PASSPORT_BATCH_ID/complete" \
            -H 'Content-Type: application/json' \
            -d '{"attemptCount":1,"failedCount":0}' \
            > /tmp/passport-batch-complete.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PERMIT_BATCH_ID/complete" \
            -H 'Content-Type: application/json' \
            -d '{"attemptCount":2,"failedCount":1}' \
            > /tmp/permit-batch-complete.json

          grep -q '"status":"COMPLETED"' /tmp/passport-batch-complete.json
          grep -q '"status":"COMPLETED"' /tmp/permit-batch-complete.json
          grep -q '"attemptCount":2' /tmp/permit-batch-complete.json
          grep -q '"failedCount":1' /tmp/permit-batch-complete.json

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/scan-batches?limit=5" > /tmp/recent-batches.json
          python3 -c "import json; rows=json.load(open('/tmp/recent-batches.json')); assert len(rows) == 2, rows; assert all(row['status'] == 'COMPLETED' for row in rows), rows; permit=next(row for row in rows if row['documentType'] == 'TAIWAN_COMPATRIOT_PERMIT'); assert permit['itemCount'] == 1 and permit['attemptCount'] == 2 and permit['failedCount'] == 1, permit"

          APPEND_STATUS=$(curl --silent --output /tmp/rejected-completed-batch-item.json --write-out "%{http_code}" -X POST "http://localhost:5080/api/scan-batches/$PASSPORT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"late.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小明\",\"nameEn\":\"WANG, HSIAO-MING\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":\"TWN\",\"documentNumber\":\"T99999999\",\"issuingCountry\":\"TWN\",\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{}\"}")
          test "$APPEND_STATUS" = "400"

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/review-queue" > /tmp/review-queue-before.json
          python3 -c "import json; rows=json.load(open('/tmp/review-queue-before.json')); assert len(rows) == 2, rows"

          PERMIT_ITEM_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-scan-item.json'))['scanItemId'])")

          curl --fail --silent -X PUT "http://localhost:5080/api/scan-items/$PERMIT_ITEM_ID/review" \
            -H 'Content-Type: application/json' \
            -d '{"nameZh":"王小明","nameEn":"","birthDate":"1990-01-15","gender":"M","nationality":null,"documentNumber":"12345678","issuingCountry":null,"expiryDate":"2030-12-31","useForTraining":true}' \
            > /tmp/permit-reviewed.json

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/review-queue" > /tmp/review-queue-after.json
          python3 -c "import json; rows=json.load(open('/tmp/review-queue-after.json')); assert len(rows) == 1, rows; assert rows[0]['nameZh'] == '王小明', rows; assert len(rows[0]['documents']) == 2, rows"

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID" > /tmp/tour-detail-after-review.json
          python3 -c "import json; data=json.load(open('/tmp/tour-detail-after-review.json')); assert len(data['members']) == 1, data; docs=data['members'][0]['documents']; assert len(docs) == 1, docs; assert docs[0]['documentType'] == 'TAIWAN_COMPATRIOT_PERMIT', docs"

          LINK_COUNT=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT COUNT(*) FROM tour_member_documents;" | tr -d '\r')
          test "$LINK_COUNT" = "1"

          curl --fail --silent "http://localhost:5080/api/ocr-benchmark/summary" > /tmp/ocr-benchmark.json
          python3 -c "import json; data=json.load(open('/tmp/ocr-benchmark.json')); assert data['reviewedSampleCount'] == 1, data; assert data['scoredSampleCount'] == 1, data; doc=data['documents'][0]; assert doc['manualCorrectionCount'] == 1, doc; assert doc['averageTotalMs'] == 1234, doc"

          curl --fail --silent "http://localhost:5080/api/ocr-training/summary" > /tmp/training-summary.json
          python3 -c "import json; data=json.load(open('/tmp/training-summary.json')); assert data['sampleCount'] == 1, data; assert data['documents'][0]['sampleCount'] == 1, data"

          curl --fail --silent "http://localhost:5080/api/ocr-training/export.zip" -o /tmp/training.zip
          unzip -l /tmp/training.zip > /tmp/training-files.txt
          grep -q 'manifest.jsonl' /tmp/training-files.txt
          grep -q 'README.txt' /tmp/training-files.txt

          curl --fail --silent "http://localhost:5080/api/travelers?documentType=TAIWAN_COMPATRIOT_PERMIT&gender=M&limit=10" > /tmp/travelers-filtered.json
          python3 -c "import json; rows=json.load(open('/tmp/travelers-filtered.json')); assert len(rows) == 1, rows; assert 'TAIWAN_COMPATRIOT_PERMIT' in rows[0]['currentDocumentTypes'], rows"

          curl --fail --silent "http://localhost:5080/api/travelers?documentType=PASSPORT&limit=10" > /tmp/travelers-passport.json
          python3 -c "import json; rows=json.load(open('/tmp/travelers-passport.json')); assert len(rows) == 0, rows"

          curl --fail --silent -X POST "http://localhost:5080/api/ocr-benchmark/runs" \
            -H 'Content-Type: application/json' \
            -d '{"pipelineVersion":"ci-smoke","sampleCount":1,"failedCount":0,"baselineCreatedCount":0,"summaryJson":"{\"sampleCount\":1}"}' \
            > /tmp/benchmark-run.json
          grep -q '"pipelineVersion":"ci-smoke"' /tmp/benchmark-run.json

          curl --fail --silent "http://localhost:5080/api/ocr-benchmark/runs?limit=5" > /tmp/benchmark-runs.json
          python3 -c "import json; rows=json.load(open('/tmp/benchmark-runs.json')); assert rows and rows[0]['pipelineVersion'] == 'ci-smoke', rows"

      - name: Verify production photo retention preserves training copy
        run: |
          PERMIT_ITEM_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-scan-item.json'))['scanItemId'])")
          TRAINING_SAMPLE_ID=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT training_sample_id FROM training_samples WHERE source_scan_item_id = '$PERMIT_ITEM_ID';" | tr -d '\r')
          test -n "$TRAINING_SAMPLE_ID"

          curl --fail --silent "http://localhost:5080/api/scan-items/$PERMIT_ITEM_ID/image" -o /tmp/production-before.png
          curl --fail --silent "http://localhost:5080/api/ocr-training/samples/$TRAINING_SAMPLE_ID/image" -o /tmp/training-before.png

          docker compose exec -T database psql -U passport_scanner -d passport_scanner -v ON_ERROR_STOP=1 -c "UPDATE scan_items SET delete_after = NOW() - INTERVAL '1 hour' WHERE scan_item_id = '$PERMIT_ITEM_ID';"

          docker compose restart backend

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:5080/api/health > /dev/null

          for i in {1..30}; do
            IMAGE_BYTES=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT octet_length(image_bytes) FROM scan_items WHERE scan_item_id = '$PERMIT_ITEM_ID';" | tr -d '\r')
            if [ "$IMAGE_BYTES" = "0" ]; then
              break
            fi
            sleep 2
          done

          IMAGE_BYTES=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT octet_length(image_bytes) FROM scan_items WHERE scan_item_id = '$PERMIT_ITEM_ID';" | tr -d '\r')
          test "$IMAGE_BYTES" = "0"

          STATUS=$(curl --silent --output /tmp/production-after.txt --write-out "%{http_code}" "http://localhost:5080/api/scan-items/$PERMIT_ITEM_ID/image")
          test "$STATUS" = "404"

          curl --fail --silent "http://localhost:5080/api/ocr-training/samples/$TRAINING_SAMPLE_ID/image" -o /tmp/training-after.png
          test -s /tmp/training-after.png

          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")
          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/review-queue" > /tmp/review-queue-retention.json
          python3 -c "import json; rows=json.load(open('/tmp/review-queue-retention.json')); docs=[d for row in rows for d in row['documents'] if d['scanItemId'] == '$PERMIT_ITEM_ID']; assert len(docs) == 1, rows; assert docs[0]['imageAvailable'] is False, docs[0]"

      - name: Verify reviewed document can be removed from only this tour
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")
          PERMIT_ITEM_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-scan-item.json'))['scanItemId'])")
          DOCUMENT_VERSION_ID=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT saved_document_version_id FROM scan_items WHERE scan_item_id = '$PERMIT_ITEM_ID';" | tr -d '\r')
          TRAVELER_ID=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT traveler_id FROM document_versions WHERE document_version_id = '$DOCUMENT_VERSION_ID';" | tr -d '\r')

          STATUS=$(curl --silent --output /tmp/delete-reviewed.txt --write-out "%{http_code}" -X DELETE "http://localhost:5080/api/scan-items/$PERMIT_ITEM_ID")
          test "$STATUS" = "204"

          COUNTS=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT (SELECT COUNT(*) FROM scan_items WHERE scan_item_id = '$PERMIT_ITEM_ID'), (SELECT COUNT(*) FROM training_samples WHERE source_scan_item_id = '$PERMIT_ITEM_ID'), (SELECT COUNT(*) FROM tour_member_documents), (SELECT COUNT(*) FROM document_versions WHERE document_version_id = '$DOCUMENT_VERSION_ID'), (SELECT COUNT(*) FROM travelers WHERE traveler_id = '$TRAVELER_ID');" | tr -d '\r')
          test "$COUNTS" = "0|0|0|1|1"

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID" > /tmp/tour-after-reviewed-delete.json
          python3 -c "import json; data=json.load(open('/tmp/tour-after-reviewed-delete.json')); assert data['members'] == [], data; assert data['tour']['pendingReviewCount'] == 1, data"

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/review-queue" > /tmp/queue-after-reviewed-delete.json
          python3 -c "import json; rows=json.load(open('/tmp/queue-after-reviewed-delete.json')); assert len(rows) == 1, rows; assert len(rows[0]['documents']) == 1, rows; assert rows[0]['documents'][0]['documentType'] == 'PASSPORT', rows"

      - name: Verify large scan payload passes through frontend proxy
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent -X POST "http://localhost:5173/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/proxy-batch.json

          PROXY_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/proxy-batch.json'))['scanBatchId'])")

          python3 -c 'import json; payload={"originalFileName":"large-review.jpg","imageContentType":"image/jpeg","imageBase64":"A"*2000000,"nameZh":"大型測試","nameEn":"LARGE TEST","birthDate":"1991-02-03","gender":"M","nationality":"TWN","documentNumber":"T87654321","issuingCountry":"TWN","expiryDate":"2031-12-31","ocrPayloadJson":"{}"}; json.dump(payload, open("/tmp/large-scan.json","w"), ensure_ascii=False)'

          curl --fail --silent -X POST "http://localhost:5173/api/scan-batches/$PROXY_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/large-scan.json \
            > /tmp/large-scan-item.json

          grep -q '"scanItemId"' /tmp/large-scan-item.json

      - name: Restart backend and verify API reconnects
        run: |
          docker compose restart backend
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/tours > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend backend database
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs frontend backend database

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v
 /tmp/tables.txt
          grep -q '^tour_member_documents
          grep -q '^tour_person_drafts$' /tmp/tables.txt
          grep -q '^tours$' /tmp/tables.txt
          grep -q '^training_samples$' /tmp/tables.txt
          grep -q '^travelers$' /tmp/tables.txt
 /tmp/tables.txt
          grep -q '^tour_member_documents          grep -q '^tour_person_drafts$' /tmp/tables.txt
          grep -q '^tours$' /tmp/tables.txt
          grep -q '^training_samples$' /tmp/tables.txt
          grep -q '^travelers$' /tmp/tables.txt

      - name: Verify tour create and filters
        run: |
          curl --fail --silent -X POST http://localhost:5080/api/tours \
            -H 'Content-Type: application/json' \
            -d '{"tourName":"CI 測試團","departureDate":"2099-10-10","returnDate":"2099-10-12","requiredDocumentTypes":["PASSPORT","TAIWAN_COMPATRIOT_PERMIT"]}' \
            > /tmp/tour.json

          grep -q '"tourName":"CI 測試團"' /tmp/tour.json
          grep -q '"requiredDocumentTypes":\["PASSPORT","TAIWAN_COMPATRIOT_PERMIT"\]' /tmp/tour.json

          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID" > /tmp/tour-detail.json
          grep -q '"members":\[\]' /tmp/tour-detail.json

          curl --fail --silent "http://localhost:5080/api/tours?status=empty&documentType=PASSPORT&departureFrom=2099-10-01&departureTo=2099-10-31" > /tmp/tours-filtered.json
          grep -q "$TOUR_ID" /tmp/tours-filtered.json

          curl --fail --silent "http://localhost:5080/api/tours?status=complete" > /tmp/tours-complete.json
          if grep -q "$TOUR_ID" /tmp/tours-complete.json; then
            echo "Empty tour must not appear in complete filter."
            exit 1
          fi

      - name: Verify staged review, batch lifecycle and training
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")
          IMAGE_BASE64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/passport-batch.json
          PASSPORT_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/passport-batch.json'))['scanBatchId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"TAIWAN_COMPATRIOT_PERMIT"}' \
            > /tmp/permit-batch.json
          PERMIT_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-batch.json'))['scanBatchId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PASSPORT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"passport.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小明\",\"nameEn\":\"WANG, HSIAO-MING\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":\"TWN\",\"documentNumber\":\"T12345678\",\"issuingCountry\":\"TWN\",\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{}\"}" \
            > /tmp/passport-scan-item.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PERMIT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"permit.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小朋\",\"nameEn\":\"\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":null,\"documentNumber\":\"12345678\",\"issuingCountry\":null,\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{\\\"totalMs\\\":1234,\\\"orientationAttempts\\\":2,\\\"fallbackUsed\\\":false,\\\"originalFields\\\":{\\\"nameZh\\\":\\\"王小朋\\\",\\\"nameZhTraditional\\\":\\\"王小朋\\\",\\\"nameEn\\\":\\\"\\\",\\\"birthDate\\\":\\\"1990-01-15\\\",\\\"gender\\\":\\\"M\\\",\\\"nationality\\\":null,\\\"documentNumber\\\":\\\"12345678\\\",\\\"issuingCountry\\\":null,\\\"expiryDate\\\":\\\"2030-12-31\\\"}}\"}" \
            > /tmp/permit-scan-item.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PASSPORT_BATCH_ID/complete" \
            -H 'Content-Type: application/json' \
            -d '{"attemptCount":1,"failedCount":0}' \
            > /tmp/passport-batch-complete.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PERMIT_BATCH_ID/complete" \
