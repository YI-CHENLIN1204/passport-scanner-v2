name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/PassportScanner.Api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build


  docker-smoke:
    name: PostgreSQL Docker smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start database/backend
        run: docker compose up -d --build database backend

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs backend database
          exit 1

      - name: Verify PostgreSQL persistence status
        run: |
          curl --fail --silent http://localhost:5080/api/document-store/status | tee /tmp/store-status.json
          grep -q '"persistence":"postgresql"' /tmp/store-status.json

      - name: Verify database schema exists
        run: |
          docker compose exec -T database \
            psql -U passport_scanner -d passport_scanner -Atc \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('travelers','document_versions') ORDER BY table_name;" \
            | tee /tmp/tables.txt

          grep -q '^document_versions
      - name: Restart backend and verify API reconnects
        run: |
          docker compose restart backend

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/document-store/status > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs backend database
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs backend database

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v
