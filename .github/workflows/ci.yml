          python3 -c "import json; data=json.load(open('/tmp/current-merge-result.json')); docs=[d for d in data['documents'] if d['documentType']=='PASSPORT']; assert len(docs)==2, docs; current=[d for d in docs if d['isCurrent']]; assert len(current)==1, docs; assert current[0]['documentNumber']=='M44444444', docs"

          CURRENT_DUPLICATE_COUNT=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT COUNT(*) FROM document_versions WHERE traveler_id = '$CURRENT_MERGE_TARGET' AND document_type = 'PASSPORT' AND is_current = TRUE;" | tr -d '\r')
          test "$CURRENT_DUPLICATE_COUNT" = "1"

