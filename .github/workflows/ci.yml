name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/PassportScanner.Api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  docker-smoke:
    name: PostgreSQL and tour workspace smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start database/backend
        run: docker compose up -d --build database backend

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend database
          exit 1

      - name: Verify PostgreSQL persistence status
        run: |
          curl --fail --silent http://localhost:5080/api/document-store/status > /tmp/store-status.json
          cat /tmp/store-status.json
          grep -q '"persistence":"postgresql"' /tmp/store-status.json

      - name: Verify database schema exists
        run: |
          docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('travelers','document_versions','tours','tour_members','scan_batches','scan_items','tour_person_drafts') ORDER BY table_name;" > /tmp/tables.txt
          cat /tmp/tables.txt
          grep -q '^document_versions

      - name: Verify tour create/list/detail flow
        run: |
          curl --fail --silent -X POST http://localhost:5080/api/tours \
            -H 'Content-Type: application/json' \
            -d '{"tourName":"CI 測試團","departureDate":"2026-10-10","returnDate":"2026-10-12","requiredDocumentTypes":["PASSPORT","TAIWAN_COMPATRIOT_PERMIT"]}' \
            > /tmp/tour.json

          cat /tmp/tour.json
          grep -q '"tourName":"CI 測試團"' /tmp/tour.json
          grep -q '"requiredDocumentTypes":\["PASSPORT","TAIWAN_COMPATRIOT_PERMIT"\]' /tmp/tour.json

          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent http://localhost:5080/api/tours > /tmp/tours.json
          grep -q "$TOUR_ID" /tmp/tours.json

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID" > /tmp/tour-detail.json
          grep -q '"members":\[\]' /tmp/tour-detail.json

      - name: Verify staged documents auto regroup after review correction
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/passport-batch.json
          PASSPORT_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/passport-batch.json'))['scanBatchId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"TAIWAN_COMPATRIOT_PERMIT"}' \
            > /tmp/permit-batch.json
          PERMIT_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-batch.json'))['scanBatchId'])")

          IMAGE_BASE64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PASSPORT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"passport.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小明\",\"nameEn\":\"WANG, HSIAO-MING\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":\"TWN\",\"documentNumber\":\"T12345678\",\"issuingCountry\":\"TWN\",\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{}\"}" \
            > /tmp/passport-scan-item.json

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$PERMIT_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"permit.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"王小朋\",\"nameEn\":\"\",\"birthDate\":\"1990-01-15\",\"gender\":\"M\",\"nationality\":null,\"documentNumber\":\"12345678\",\"issuingCountry\":null,\"expiryDate\":\"2030-12-31\",\"ocrPayloadJson\":\"{}\"}" \
            > /tmp/permit-scan-item.json

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/review-queue" \
            > /tmp/review-queue-before.json
          python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/review-queue-before.json'))
          assert len(rows) == 2, rows
          PY

          PERMIT_ITEM_ID=$(python3 -c "import json; print(json.load(open('/tmp/permit-scan-item.json'))['scanItemId'])")

          curl --fail --silent -X PUT "http://localhost:5080/api/scan-items/$PERMIT_ITEM_ID/review" \
            -H 'Content-Type: application/json' \
            -d '{"nameZh":"王小明","nameEn":"","birthDate":"1990-01-15","gender":"M","nationality":null,"documentNumber":"12345678","issuingCountry":null,"expiryDate":"2030-12-31"}' \
            > /tmp/permit-reviewed.json

          curl --fail --silent "http://localhost:5080/api/tours/$TOUR_ID/review-queue" \
            > /tmp/review-queue-after.json
          python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/review-queue-after.json'))
          assert len(rows) == 1, rows
          assert rows[0]['nameZh'] == '王小明', rows
          assert len(rows[0]['documents']) == 2, rows
          types = {item['documentType'] for item in rows[0]['documents']}
          assert types == {'PASSPORT', 'TAIWAN_COMPATRIOT_PERMIT'}, types
          PY

      - name: Restart backend and verify API reconnects
        run: |
          docker compose restart backend
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/tours > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend database
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs backend database

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v
 /tmp/tables.txt
          grep -q '^scan_batches

      - name: Verify tour create/list/detail flow
        run: |
