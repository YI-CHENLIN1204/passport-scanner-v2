            -d "{\"schemaVersion\":2,\"documentType\":\"passport\",\"chineseName\":\"合併新證\",\"englishName\":\"MERGE NEW\",\"passportNumber\":\"M44444444\",\"nationality\":\"TWN\",\"issuingState\":\"TWN\",\"birthDate\":\"1992-02-02\",\"sex\":\"M\",\"expiryDate\":\"2038-01-01\",\"verification\":{\"passportNumberCheckDigit\":true,\"birthDateCheckDigit\":true,\"expiryDateCheckDigit\":true,\"compositeCheckDigit\":true},\"reviewAssertions\":{\"chineseNameVisuallyConfirmed\":true,\"englishNameVisuallyConfirmed\":true},\"ocr\":{\"engine\":\"paddleocr-ppocrv5\",\"line2Validated\":true,\"chineseNameSource\":\"name-field\",\"chineseNameScore\":0.9,\"chineseNameRomanizationStatus\":\"compatible\",\"fallbackUsed\":false,\"averageScore\":0.9},\"reviewedAt\":\"$REVIEWED_AT_NEW\"}" \
            > /tmp/current-merge-source.json

