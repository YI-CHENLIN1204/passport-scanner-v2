            -d "{\"schemaVersion\":2,\"documentType\":\"passport\",\"chineseName\":\"\",\"englishName\":\"JOHN SMITH\",\"passportNumber\":\"P7654321\",\"nationality\":\"USA\",\"issuingState\":\"USA\",\"birthDate\":\"1985-04-12\",\"sex\":\"M\",\"expiryDate\":\"2039-04-11\",\"verification\":{\"passportNumberCheckDigit\":true,\"birthDateCheckDigit\":true,\"expiryDateCheckDigit\":true,\"compositeCheckDigit\":true},\"reviewAssertions\":{\"chineseNameVisuallyConfirmed\":false,\"englishNameVisuallyConfirmed\":true},\"ocr\":{\"engine\":\"paddleocr-ppocrv5\",\"line2Validated\":true,\"chineseNameSource\":null,\"chineseNameScore\":null,\"chineseNameRomanizationStatus\":\"unknown\",\"fallbackUsed\":false,\"averageScore\":0.9},\"reviewedAt\":\"$REVIEWED_AT\"}" \
            > /tmp/foreign-passport-2.json

          FOREIGN_TRAVELER_2=$(python3 -c "import json; print(json.load(open('/tmp/foreign-passport-2.json'))['travelerId'])")
          test "$FOREIGN_TRAVELER_1" = "$FOREIGN_TRAVELER_2"

          curl --fail --silent "http://localhost:5080/api/travelers/$FOREIGN_TRAVELER_1" > /tmp/foreign-traveler.json
          python3 -c "import json; data=json.load(open('/tmp/foreign-traveler.json')); assert data['traveler']['nameZh'] == '', data; assert data['traveler']['nameEn'] == 'JOHN SMITH', data; assert len(data['documents']) == 2, data"

      - name: Verify foreign passport can keep X sex without Taiwan ID
        run: |
          REVIEWED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          curl --fail --silent -X POST http://localhost:5080/api/passport-reviews \
            -H 'Content-Type: application/json' \
            -d "{\"schemaVersion\":2,\"documentType\":\"passport\",\"chineseName\":\"\",\"englishName\":\"ALEX MORGAN\",\"passportNumber\":\"X9876543\",\"nationality\":\"USA\",\"issuingState\":\"USA\",\"birthDate\":\"1990-06-15\",\"sex\":\"X\",\"expiryDate\":\"2020-06-14\",\"verification\":{\"passportNumberCheckDigit\":true,\"birthDateCheckDigit\":true,\"expiryDateCheckDigit\":true,\"compositeCheckDigit\":true},\"reviewAssertions\":{\"chineseNameVisuallyConfirmed\":false,\"englishNameVisuallyConfirmed\":true},\"ocr\":{\"engine\":\"paddleocr-ppocrv5\",\"line2Validated\":true,\"chineseNameSource\":null,\"chineseNameScore\":null,\"chineseNameRomanizationStatus\":\"unknown\",\"fallbackUsed\":false,\"averageScore\":0.9},\"reviewedAt\":\"$REVIEWED_AT\"}" \
            > /tmp/foreign-x-passport.json

          FOREIGN_X_ID=$(python3 -c "import json; print(json.load(open('/tmp/foreign-x-passport.json'))['travelerId'])")
          curl --fail --silent "http://localhost:5080/api/travelers/$FOREIGN_X_ID" > /tmp/foreign-x-traveler.json
          python3 -c "import json; data=json.load(open('/tmp/foreign-x-traveler.json')); t=data['traveler']; assert t['gender']=='X', data; assert t['nationalIdNumber'] is None, data; assert t['nameZh']=='', data; assert len([d for d in data['documents'] if d['documentType']=='PASSPORT' and d['isCurrent']])==1, data"

          IMPOSSIBLE_BIRTH_STATUS=$(curl --silent --output /tmp/foreign-x-impossible-birth.json --write-out "%{http_code}" -X PUT "http://localhost:5080/api/travelers/$FOREIGN_X_ID" \
            -H 'Content-Type: application/json' \
            -d '{"nameZh":"","nameEn":"ALEX MORGAN","birthDate":"2021-01-01","gender":"X","nationality":"USA","nationalIdNumber":null,"documents":[]}')
          test "$IMPOSSIBLE_BIRTH_STATUS" = "400"
          grep -q '護照有效期限必須晚於出生日期' /tmp/foreign-x-impossible-birth.json

      - name: Verify foreign passport through batch review
        run: |
          IMAGE_BASE64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='

          curl --fail --silent -X POST http://localhost:5080/api/tours \
            -H 'Content-Type: application/json' \
            -d '{"tourName":"CI Foreign Batch","departureDate":"2099-12-10","returnDate":"2099-12-12","requiredDocumentTypes":["PASSPORT"]}' \
            > /tmp/foreign-batch-tour.json
          FOREIGN_TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/foreign-batch-tour.json'))['tourId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$FOREIGN_TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/foreign-batch.json
          FOREIGN_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/foreign-batch.json'))['scanBatchId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$FOREIGN_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            -d "{\"originalFileName\":\"foreign-passport.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"\",\"nameEn\":\"JANE DOE\",\"birthDate\":\"1988-08-08\",\"gender\":\"F\",\"nationality\":\"USA\",\"documentNumber\":\"X1234567\",\"issuingCountry\":\"USA\",\"expiryDate\":\"2038-08-07\",\"ocrPayloadJson\":\"{}\"}" \
            > /tmp/foreign-batch-item.json
          FOREIGN_ITEM_ID=$(python3 -c "import json; print(json.load(open('/tmp/foreign-batch-item.json'))['scanItemId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$FOREIGN_BATCH_ID/complete" \
            -H 'Content-Type: application/json' \
            -d '{"attemptCount":1,"failedCount":0}' \
            > /tmp/foreign-batch-complete.json

          curl --fail --silent -X PUT "http://localhost:5080/api/scan-items/$FOREIGN_ITEM_ID/review" \
            -H 'Content-Type: application/json' \
            -d '{"nameZh":"","nameZhOnDocument":"","nameEn":"JANE DOE","birthDate":"1988-08-08","gender":"F","nationality":"USA","nationalIdNumber":null,"documentNumber":"X1234567","issuingCountry":"USA","expiryDate":"2038-08-07","useForTraining":false}' \
            > /tmp/foreign-batch-reviewed.json

          grep -q '"reviewStatus":"REVIEWED"' /tmp/foreign-batch-reviewed.json

          curl --fail --silent "http://localhost:5080/api/tours/$FOREIGN_TOUR_ID" > /tmp/foreign-batch-tour-after.json
          python3 -c "import json; data=json.load(open('/tmp/foreign-batch-tour-after.json')); assert len(data['members']) == 1, data; member=data['members'][0]; assert member['nameZh'] == '', member; assert member['nameEn'] == 'JANE DOE', member; assert len(member['documents']) == 1, member"

      - name: Verify large scan payload passes through frontend proxy
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent -X POST "http://localhost:5173/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/proxy-batch.json

          PROXY_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/proxy-batch.json'))['scanBatchId'])")

          python3 -c 'import json; payload={"originalFileName":"large-review.jpg","imageContentType":"image/jpeg","imageBase64":"A"*2000000,"nameZh":"大型測試","nameEn":"LARGE TEST","birthDate":"1991-02-03","gender":"M","nationality":"TWN","documentNumber":"T87654321","issuingCountry":"TWN","expiryDate":"2031-12-31","ocrPayloadJson":"{}"}; json.dump(payload, open("/tmp/large-scan.json","w"), ensure_ascii=False)'

          curl --fail --silent -X POST "http://localhost:5173/api/scan-batches/$PROXY_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/large-scan.json \
            > /tmp/large-scan-item.json

          grep -q '"scanItemId"' /tmp/large-scan-item.json

      - name: Verify fixed Test cohort and baseline are immutable
        run: |
          IMAGE_BASE64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='

          curl --fail --silent -X POST http://localhost:5080/api/tours \
            -H 'Content-Type: application/json' \
            -d '{"tourName":"CI Fixed Test Cohort","departureDate":"2099-12-01","returnDate":"2099-12-03","requiredDocumentTypes":["PASSPORT"]}' \
            > /tmp/fixed-cohort-tour.json
          FIXED_TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/fixed-cohort-tour.json'))['tourId'])")

          curl --fail --silent -X POST "http://localhost:5080/api/tours/$FIXED_TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/fixed-cohort-batch.json
          FIXED_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/fixed-cohort-batch.json'))['scanBatchId'])")

          FOUND_TEST=0
          for i in $(seq 1 50); do
            PADDED=$(printf "%03d" "$i")
            FILE="/tmp/fixed-cohort-item-$PADDED.json"

            curl --fail --silent -X POST "http://localhost:5080/api/scan-batches/$FIXED_BATCH_ID/items" \
              -H 'Content-Type: application/json' \
              -d "{\"originalFileName\":\"fixed-$PADDED.png\",\"imageContentType\":\"image/png\",\"imageBase64\":\"$IMAGE_BASE64\",\"nameZh\":\"\",\"nameEn\":\"FIXED TEST $PADDED\",\"birthDate\":\"1990-01-01\",\"gender\":\"X\",\"nationality\":\"USA\",\"nationalIdNumber\":null,\"documentNumber\":\"FT$PADDED\",\"issuingCountry\":\"USA\",\"expiryDate\":\"2035-01-01\",\"ocrPayloadJson\":\"{}\"}" \
              > "$FILE"

            ITEM_ID=$(python3 -c "import json; print(json.load(open('$FILE'))['scanItemId'])")

            curl --fail --silent -X PUT "http://localhost:5080/api/scan-items/$ITEM_ID/review" \
              -H 'Content-Type: application/json' \
              -d "{\"nameZh\":\"\",\"nameZhOnDocument\":\"\",\"nameEn\":\"FIXED TEST $PADDED\",\"birthDate\":\"1990-01-01\",\"gender\":\"X\",\"nationality\":\"USA\",\"nationalIdNumber\":null,\"documentNumber\":\"FT$PADDED\",\"issuingCountry\":\"USA\",\"expiryDate\":\"2035-01-01\",\"useForTraining\":true}" \
              > /tmp/fixed-cohort-reviewed.json

            curl --fail --silent "http://localhost:5080/api/ocr-training/evaluation-samples?split=test" > /tmp/fixed-cohort-test-before.json
            TEST_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/fixed-cohort-test-before.json'))))")
            if [ "$TEST_COUNT" -gt "0" ]; then
              FOUND_TEST=1
              break
            fi
          done

          test "$FOUND_TEST" = "1"

          curl --fail --silent -X POST "http://localhost:5080/api/ocr-training/fixed-test/reserve" > /tmp/fixed-cohort-reserve.json
          python3 -c "import json; data=json.load(open('/tmp/fixed-cohort-reserve.json')); assert data['sampleCount'] > 0, data; assert data['newlyReservedCount'] == data['sampleCount'], data"

          curl --fail --silent "http://localhost:5080/api/ocr-training/evaluation-samples?split=fixed-test" > /tmp/fixed-cohort-samples.json
          FIXED_TRAINING_SAMPLE_ID=$(python3 -c "import json; rows=json.load(open('/tmp/fixed-cohort-samples.json')); assert rows, rows; print(rows[0]['trainingSampleId'])")
          FIXED_SCAN_ITEM_ID=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT source_scan_item_id FROM training_samples WHERE training_sample_id = '$FIXED_TRAINING_SAMPLE_ID';" | tr -d '\r')

          python3 -c "import json; rows=json.load(open('/tmp/fixed-cohort-samples.json')); assert all(json.loads(row['evaluationBaselineJson']).get('state') == 'pending' for row in rows), rows"

          curl --fail --silent -X PUT "http://localhost:5080/api/ocr-training/samples/$FIXED_TRAINING_SAMPLE_ID/evaluation-baseline" \
            -H 'Content-Type: application/json' \
            -d '{"resultJson":"{\"pipelineVersion\":\"ci-fixed\",\"fields\":{}}"}' \
            > /tmp/fixed-baseline.json

          curl --fail --silent "http://localhost:5080/api/ocr-training/evaluation-samples?split=fixed-test" > /tmp/fixed-cohort-after-baseline.json
          python3 -c "import json; rows=json.load(open('/tmp/fixed-cohort-after-baseline.json')); target=next(row for row in rows if row['trainingSampleId'] == '$FIXED_TRAINING_SAMPLE_ID'); payload=json.loads(target['evaluationBaselineJson']); assert payload['pipelineVersion'] == 'ci-fixed', target"

          RESERVE_AGAIN=$(curl --fail --silent -X POST "http://localhost:5080/api/ocr-training/fixed-test/reserve")
          python3 -c "import json; data=json.loads('''$RESERVE_AGAIN'''); assert data['newlyReservedCount'] == 0, data"

          FIXED_GT_HASH_BEFORE=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT md5(ground_truth_json) FROM training_samples WHERE training_sample_id = '$FIXED_TRAINING_SAMPLE_ID';" | tr -d '\r')
          FIXED_TRAVELER_ID=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT document.traveler_id FROM scan_items AS scan INNER JOIN document_versions AS document ON document.document_version_id = scan.saved_document_version_id WHERE scan.scan_item_id = '$FIXED_SCAN_ITEM_ID';" | tr -d '\r')
          test -n "$FIXED_TRAVELER_ID"

          curl --fail --silent "http://localhost:5080/api/travelers/$FIXED_TRAVELER_ID" > /tmp/fixed-traveler-before-edit.json
          python3 -c "import json,datetime; data=json.load(open('/tmp/fixed-traveler-before-edit.json')); t=data['traveler']; new_birth=(datetime.date.fromisoformat(t['birthDate'])+datetime.timedelta(days=1)).isoformat(); payload={'nameZh':t['nameZh'],'nameEn':t['nameEn'],'birthDate':new_birth,'gender':t['gender'],'nationality':t['nationality'],'nationalIdNumber':t['nationalIdNumber'],'documents':[]}; json.dump(payload,open('/tmp/fixed-traveler-edit.json','w'),ensure_ascii=False); open('/tmp/fixed-birth-after.txt','w').write(new_birth)"

          curl --fail --silent -X PUT "http://localhost:5080/api/travelers/$FIXED_TRAVELER_ID" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/fixed-traveler-edit.json \
            > /tmp/fixed-traveler-after-edit.json

          EXPECTED_FIXED_BIRTH=$(cat /tmp/fixed-birth-after.txt)
          FIXED_SCAN_BIRTH=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT birth_date FROM scan_items WHERE scan_item_id = '$FIXED_SCAN_ITEM_ID';" | tr -d '\r')
          test "$FIXED_SCAN_BIRTH" = "$EXPECTED_FIXED_BIRTH"

          FIXED_GT_HASH_AFTER_TRAVELER_EDIT=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT md5(ground_truth_json) FROM training_samples WHERE training_sample_id = '$FIXED_TRAINING_SAMPLE_ID';" | tr -d '\r')
          test "$FIXED_GT_HASH_AFTER_TRAVELER_EDIT" = "$FIXED_GT_HASH_BEFORE"

          curl --fail --silent -X PUT "http://localhost:5080/api/scan-items/$FIXED_SCAN_ITEM_ID/training-selection" \
            -H 'Content-Type: application/json' \
            -d '{"selected":true}' \
            > /tmp/fixed-baseline-reselect.json

          FIXED_GT_HASH_AFTER_RESELECT=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT md5(ground_truth_json) FROM training_samples WHERE training_sample_id = '$FIXED_TRAINING_SAMPLE_ID';" | tr -d '\r')
          test "$FIXED_GT_HASH_AFTER_RESELECT" = "$FIXED_GT_HASH_BEFORE"

          DESELECT_STATUS=$(curl --silent --output /tmp/fixed-baseline-deselect.json --write-out "%{http_code}" -X PUT "http://localhost:5080/api/scan-items/$FIXED_SCAN_ITEM_ID/training-selection" \
            -H 'Content-Type: application/json' \
            -d '{"selected":false}')
          test "$DESELECT_STATUS" = "400"
          grep -q '固定 Test baseline' /tmp/fixed-baseline-deselect.json

          DELETE_STATUS=$(curl --silent --output /tmp/fixed-baseline-delete.json --write-out "%{http_code}" -X DELETE "http://localhost:5080/api/scan-items/$FIXED_SCAN_ITEM_ID")
          test "$DELETE_STATUS" = "400"
          grep -q '不可直接刪除' /tmp/fixed-baseline-delete.json

          SAMPLE_COUNT=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT COUNT(*) FROM training_samples WHERE training_sample_id = '$FIXED_TRAINING_SAMPLE_ID';" | tr -d '\r')
          BASELINE_COUNT_AFTER=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT COUNT(*) FROM ocr_evaluation_baselines WHERE training_sample_id = '$FIXED_TRAINING_SAMPLE_ID';" | tr -d '\r')
          SOURCE_COUNT=$(docker compose exec -T database psql -U passport_scanner -d passport_scanner -Atc "SELECT COUNT(*) FROM scan_items WHERE scan_item_id = '$FIXED_SCAN_ITEM_ID';" | tr -d '\r')

          test "$SAMPLE_COUNT" = "1"
          test "$BASELINE_COUNT_AFTER" = "1"
          test "$SOURCE_COUNT" = "1"

      - name: Verify database backup scripts
        run: |
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw './scripts/backup-db.ps1')); [void][scriptblock]::Create((Get-Content -Raw './scripts/restore-db.ps1'))"

          rm -rf ./ci-backups
          pwsh -NoProfile -File ./scripts/backup-db.ps1 -OutputDirectory ./ci-backups

          BACKUP_FILE=$(find ./ci-backups -maxdepth 1 -type f -name '*.dump' | head -n 1)
          HASH_FILE=$(find ./ci-backups -maxdepth 1 -type f -name '*.dump.sha256.txt' | head -n 1)

          test -n "$BACKUP_FILE"
          test -f "$BACKUP_FILE"
          test -n "$HASH_FILE"
          test -f "$HASH_FILE"

          EXPECTED_HASH=$(awk '{print $1}' "$HASH_FILE" | tr '[:lower:]' '[:upper:]')
          ACTUAL_HASH=$(sha256sum "$BACKUP_FILE" | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          test "$EXPECTED_HASH" = "$ACTUAL_HASH"

          docker compose cp "$BACKUP_FILE" database:/tmp/ci-backup.dump
          docker compose exec -T database pg_restore --list /tmp/ci-backup.dump > /dev/null
          docker compose exec -T database rm -f /tmp/ci-backup.dump

      - name: Restart backend and verify API reconnects
        run: |
          docker compose restart backend
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/tours > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend backend database
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs frontend backend database

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v
