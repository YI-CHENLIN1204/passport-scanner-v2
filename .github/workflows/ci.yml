          python3 -c "import json; data=json.load(open('/tmp/foreign-batch-tour-after.json')); assert len(data['members']) == 1, data; member=data['members'][0]; assert member['nameZh'] == '', member; assert member['nameEn'] == 'JANE DOE', member; assert len(member['documents']) == 1, member"

      - name: Verify large scan payload passes through frontend proxy
        run: |
          TOUR_ID=$(python3 -c "import json; print(json.load(open('/tmp/tour.json'))['tourId'])")

          curl --fail --silent -X POST "http://localhost:5173/api/tours/$TOUR_ID/scan-batches" \
            -H 'Content-Type: application/json' \
            -d '{"documentType":"PASSPORT"}' \
            > /tmp/proxy-batch.json

          PROXY_BATCH_ID=$(python3 -c "import json; print(json.load(open('/tmp/proxy-batch.json'))['scanBatchId'])")

          python3 -c 'import json; payload={"originalFileName":"large-review.jpg","imageContentType":"image/jpeg","imageBase64":"A"*2000000,"nameZh":"大型測試","nameEn":"LARGE TEST","birthDate":"1991-02-03","gender":"M","nationality":"TWN","documentNumber":"T87654321","issuingCountry":"TWN","expiryDate":"2031-12-31","ocrPayloadJson":"{}"}; json.dump(payload, open("/tmp/large-scan.json","w"), ensure_ascii=False)'

          curl --fail --silent -X POST "http://localhost:5173/api/scan-batches/$PROXY_BATCH_ID/items" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/large-scan.json \
            > /tmp/large-scan-item.json

          grep -q '"scanItemId"' /tmp/large-scan-item.json

      - name: Verify database backup scripts
        run: |
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw './scripts/backup-db.ps1')); [void][scriptblock]::Create((Get-Content -Raw './scripts/restore-db.ps1'))"

          rm -rf ./ci-backups
          pwsh -NoProfile -File ./scripts/backup-db.ps1 -OutputDirectory ./ci-backups

          BACKUP_FILE=$(find ./ci-backups -maxdepth 1 -type f -name '*.dump' | head -n 1)
          HASH_FILE=$(find ./ci-backups -maxdepth 1 -type f -name '*.dump.sha256.txt' | head -n 1)

          test -n "$BACKUP_FILE"
          test -f "$BACKUP_FILE"
          test -n "$HASH_FILE"
          test -f "$HASH_FILE"

          EXPECTED_HASH=$(awk '{print $1}' "$HASH_FILE" | tr '[:lower:]' '[:upper:]')
          ACTUAL_HASH=$(sha256sum "$BACKUP_FILE" | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          test "$EXPECTED_HASH" = "$ACTUAL_HASH"

          docker compose cp "$BACKUP_FILE" database:/tmp/ci-backup.dump
          docker compose exec -T database pg_restore --list /tmp/ci-backup.dump > /dev/null
          docker compose exec -T database rm -f /tmp/ci-backup.dump

      - name: Restart backend and verify API reconnects
        run: |
          docker compose restart backend
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/tours > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend backend database
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs frontend backend database

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v
