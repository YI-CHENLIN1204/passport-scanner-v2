            -d "{\"nameZh\":\"合併舊證\",\"nameEn\":\"MERGE OLD\",\"birthDate\":\"1992-02-02\",\"gender\":\"M\",\"nationality\":\"TWN\",\"nationalIdNumber\":null,\"documents\":[{\"documentVersionId\":\"$HISTORICAL_PASSPORT_ID\",\"nameZhOnDocument\":\"合併舊證\",\"nameEnOnDocument\":\"MERGE OLD\",\"documentNumber\":\"M33333334\",\"issuingCountry\":\"TWN\",\"nationality\":\"TWN\",\"expiryDate\":\"2034-01-01\"}]}")
          test "$HISTORICAL_EDIT_STATUS" = "400"
