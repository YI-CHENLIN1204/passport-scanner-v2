server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Scan review images are sent as base64 JSON. A 15 MB decoded image
    # becomes roughly 20 MB on the wire, so keep the proxy limit above
    # the backend's decoded-image safety limit.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PaddleOCR models are bundled into the Docker image at build time.
    # Serve them as static same-origin files; never route model requests
    # through the SPA fallback.
    location /paddle-models/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/x-tar;
    }


    location / {
        try_files $uri $uri/ /index.html;
    }
}