server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PaddleOCR browser models must remain same-origin. Without this
    # location, the SPA fallback returns index.html for model .tar URLs,
    # which PaddleOCR then reports as "inference.onnx was not found".
    location /paddle-models/ {
        # Resolve the external model host lazily through Docker's embedded
        # DNS. A transient DNS failure must not prevent nginx from starting.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $paddle_model_host paddle-model-ecology.bj.bcebos.com;

        rewrite ^/paddle-models/(.*)$ /$1 break;
        proxy_pass https://$paddle_model_host;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name $paddle_model_host;

        proxy_set_header Host $paddle_model_host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}